  return '<button class="card'+(dim?' dim':'')+(it.img?' has-img':'')+'" data-open="'+esc(it.id)+'">'+(it.img?'<img class="thumb" src="'+esc(it.img)+'" alt="" loading="lazy">':'')+'<div class="card-body"><div class="card-top"><h3>'+esc(it.name)+'</h3><span class="kind">'+esc(lineLabel(it))+'</span></div>'
   +'<div class="tags">'+tagsFor(it)+'</div>'
   +(it.desc?'<p class="desc">'+esc(it.desc)+'</p>':'')
   +((it.diet||it.check||it.example||!isLive(it))?'<div class="tags">'+(it.diet?'<span class="tag d">'+esc(it.diet)+'</span>':'')+(it.check?'<span class="tag chk">'+esc(it.check)+'</span>':'')+(!isLive(it)?'<span class="tag off">Not on sale</span>':'')+(it.example?'<span class="tag ex">Example item</span>':'')+'</div>':'')+'</div></button>'
}
function matrix(items){
  var h='<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="item">Item</th>';
  AL.forEach(function(a){h+='<th scope="col"'+(ui.avoid.indexOf(a[0])>=0?' class="hi"':'')+'>'+esc(a[1])+'</th>'});
  h+='</tr></thead><tbody>';var last='';
  items.forEach(function(it){
    var g=grpLabel(it);if(g!==last){last=g;h+='<tr class="grp"><td colspan="'+(AL.length+1)+'">'+esc(g)+'</td></tr>'}
    h+='<tr><th class="item" scope="row"><button data-open="'+esc(it.id)+'">'+(it.img?'<img class="mthumb" src="'+esc(it.img)+'" alt="" loading="lazy">':'')+'<span>'+esc(it.name)+'</span>'+(it.example?' <span class="tag ex">Example</span>':'')+'</button></th>';
    AL.forEach(function(a){var v=lv(it,a[0]);var hi=ui.avoid.indexOf(a[0])>=0?' class="hi"':'';
      h+='<td'+hi+'>'+(v===2?'<span class="dot c" title="Contains" aria-label="Contains">●</span>':v===1?'<span class="dot m" title="May contain" aria-label="May contain">?</span>':'<span aria-label="Not listed"></span>')+'</td>'});
    h+='</tr>'});
  return h+'</tbody></table></div>'
}

function render(){
  var app=document.getElementById('app');
  var all=sortItems(S.items.filter(matches));
  var safe=all.filter(isSafe),unsafe=all.filter(function(i){return !isSafe(i)});
  var nEx=S.items.filter(function(i){return i.example}).length;
  var h='<header class="top"><div class="wrap"><div class="row1"><div class="brand"><small>BearSt Bakery · Allergens</small>';
  if(ui.editMode&&ui.seasonEdit){
    h+='<form id="seasonForm" class="row2"><input id="seasonInput" class="search" value="'+esc(S.season)+'" aria-label="Season name"><button class="btn primary">Save</button><button type="button" class="btn" data-act="seasonCancel">Cancel</button></form>'
  }else{
    h+='<h1><span>'+esc(S.season)+'</span> menu</h1>'
  }
  h+='</div><div class="tools"><div class="seg" role="group" aria-label="Category">';
  [["all","All"],["cookie","Cookies"],["drink","Drinks"]].forEach(function(c){h+='<button data-cat="'+c[0]+'" aria-pressed="'+(ui.cat===c[0])+'">'+c[1]+'</button>'});
  h+='</div><div class="seg" role="group" aria-label="Which flavours"><button data-all="0" aria-pressed="'+!ui.all+'">On sale now</button><button data-all="1" aria-pressed="'+ui.all+'">All flavours</button></div><div class="seg" role="group" aria-label="View">';
  [["cards","Cards"],["matrix","Matrix"]].forEach(function(c){h+='<button data-view="'+c[0]+'" aria-pressed="'+(ui.view===c[0])+'">'+c[1]+'</button>'});
  h+='</div>';
  if(ui.canEdit)h+='<button class="btn'+(ui.editMode?' on':'')+'" data-act="editMode" aria-pressed="'+ui.editMode+'">'+(ui.editMode?'Done editing':'Edit')+'</button>';
  h+='</div></div>';
  h+='<div class="row2"><input id="q" class="search" type="search" placeholder="Search cookies and drinks" value="'+esc(ui.q)+'" aria-label="Search"></div>';
  h+='<div class="avoid"><div class="avoid-head"><span class="label">Customer must avoid</span><span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><label class="toggle"><input type="checkbox" id="strict"'+(ui.strict?' checked':'')+'> Also exclude “may contain”</label>'+(ui.avoid.length?'<button class="linkish" data-act="clearAvoid">Clear</button>':'')+'</span></div><div class="chips">';
  AL.forEach(function(a){h+='<button class="chip" data-avoid="'+a[0]+'" aria-pressed="'+(ui.avoid.indexOf(a[0])>=0)+'">'+esc(a[1])+'</button>'});
  h+='</div></div></div></header><main><div class="wrap">';

  if(nEx)h+='<div class="banner"><span><b>'+nEx+' example item'+(nEx>1?'s':'')+'.</b> These show how the matrix works. Replace them with your real recipes before shops rely on this.</span>'
    +(ui.editMode?(ui.confirmClear?'<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-act="clearEx">Remove examples</button><button class="btn" data-act="clearExCancel">Keep</button></span>':'<button class="btn" data-act="clearExAsk">Remove examples</button>'):'')+'</div>';
  if(all.some(function(i){return i.cat==='drink'}))h+='<div class="milknote">'+MILK+'</div>';
  if(ui.editMode)h+='<div class="row2"><button class="btn primary" data-act="add">Add item</button><button class="btn" data-act="seasonEdit">Rename season</button><span class="status">Changes save for every shop as soon as you press Save.</span></div>';

  if(!S.items.length){
    h+='<div class="empty"><p><strong>No items yet.</strong></p><p>'+(ui.canEdit?'Tap Edit, then Add item to list the first cookie or drink.':'The menu for this season hasn’t been added yet.')+'</p></div>'
  }else if(ui.view==="matrix"){
    h+='<div class="legend"><span><span class="dot c">●</span> Contains</span><span><span class="dot m">?</span> May contain (traces)</span><span>Blank = not listed</span></div>';
    h+=matrix(ui.avoid.length?safe:all);
    if(ui.avoid.length)h+='<p class="status"><strong>'+safe.length+'</strong> of '+all.length+' shown are suitable. '+unsafe.length+' hidden.</p>';
    if(!all.length)h+='<div class="empty">'+emptyMsg()+'</div>'
  }else{
    if(ui.avoid.length){
      h+='<p class="status"><strong>'+safe.length+' of '+all.length+'</strong> suitable for a customer avoiding '+esc(ui.avoid.map(function(k){return LBL[k]}).join(', '))+(ui.strict?', including traces.':'. Items that may contain traces are included.')+'</p>';
      h+='<h2 class="section-title">Suitable <span class="n">'+safe.length+'</span></h2>';
      h+=safe.length?'<div class="grid">'+safe.map(function(i){return card(i)}).join('')+'</div>':'<div class="empty">No items on this menu are suitable.</div>';
      if(unsafe.length)h+='<h2 class="section-title">Not suitable <span class="n">'+unsafe.length+'</span></h2><div class="grid">'+unsafe.map(function(i){return card(i,true)}).join('')+'</div>'
    }else{
      h+=all.length?'<div class="grid">'+all.map(function(i){return card(i)}).join('')+'</div>':'<div class="empty">'+emptyMsg()+'</div>'
    }
  }
  h+='</div></main><footer><div class="wrap">Last updated '+esc(fmtDate(S.updated))+'. Recipes and suppliers can change. If a customer has a severe allergy, check the product label and tell them about shared equipment. Read-only copy for shops.</div></footer>';
  if(ui.editing)h+=editSheet();else if(ui.open)h+=detailSheet();
  if(ui.toast)h+='<div class="toast" role="status">'+esc(ui.toast)+'</div>';
  var qf=document.activeElement&&document.activeElement.id==='q',pos=qf?document.activeElement.selectionStart:0;
  app.innerHTML=h;
  if(qf){var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}
  if(ui.seasonEdit){var si=document.getElementById('seasonInput');si&&si.focus()}
}
function emptyMsg(){if(ui.q)return 'Nothing matches “'+esc(ui.q)+'”.';if(ui.cat==="drink")return 'No drinks have been added yet.'+(ui.canEdit?' Tap Edit, then Add item.':'');return ui.all?'No items in this category.':'Nothing in this category is on sale right now. Tap All flavours to see past flavours.'}
function detailSheet(){
  var it=S.items.filter(function(i){return i.id===ui.open})[0];if(!it)return '';
  var h='<div class="sheet-bg" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(it.name)+'"><div class="sheet-head"><div><div class="kind">'+esc(CATS[it.cat]+' · '+lineLabel(it))+(it.example?' · <span class="tag ex">Example item</span>':'')+'</div><h2>'+esc(it.name)+'</h2></div><button class="btn" data-act="close">Close</button></div>';
  if(it.band||it.img)h+='<img class="hero'+(it.band?'':' sq')+'" src="'+esc(it.band||it.img)+'" alt="'+esc(it.name)+'">';
  var listed=AL.filter(function(a){return lv(it,a[0])>0}).sort(function(x,y){return lv(it,y[0])-lv(it,x[0])});
  h+='<div class="block"><span class="label">Allergens</span>'+(listed.length?'':'<p>No allergens listed.</p>')+'</div>';
  if(listed.length)h+='<div class="alist">';
  listed.forEach(function(a){var v=lv(it,a[0]);h+='<div class="arow '+(v===2?'c':'m')+'"><span>'+esc(a[1])+'</span><b>'+(v===2?'Contains':'May contain')+'</b></div>'});
  if(listed.length)h+='</div>';
  if(it.cat==='drink')h+='<div class="milknote">'+MILK+'</div>';
  if(it.diet||it.check||!isLive(it))h+='<div class="tags">'+(it.diet?'<span class="tag d">'+esc(it.diet)+'</span>':'')+(it.check?'<span class="tag chk">'+esc(it.check)+'</span>':'')+(!isLive(it)?'<span class="tag off">Not on sale right now</span>':'')+'</div>';
  if(it.desc)h+='<div class="block"><span class="label">Ingredients</span><p>'+esc(it.desc)+'</p></div>';
  if(it.notes)h+='<div class="block"><span class="label">Staff notes</span><p>'+esc(it.notes)+'</p></div>';
  h+='<div class="meta">Updated '+esc(fmtDate(it.updated))+'</div>';
  if(ui.editMode)h+='<div class="actions"><button class="btn primary" data-act="edit" data-id="'+esc(it.id)+'">Edit item</button></div>';
  return h+'</div></div>'
}
function editSheet(){
  var e=ui.editing,isNew=!S.items.some(function(i){return i.id===e.id});
  var h='<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="Edit item"><div class="sheet-head"><h2>'+(isNew?'Add item':'Edit '+esc(e.name))+'</h2><button class="btn" data-act="cancelEdit">Cancel</button></div><form class="edit" id="editForm">';
  h+='<div class="two"><div class="field"><label for="f-name">Name</label><input id="f-name" required value="'+esc(e.name)+'"></div><div class="field"><label for="f-cat">Category</label><select id="f-cat">';
  Object.keys(CATS).forEach(function(k){h+='<option value="'+k+'"'+(e.cat===k?' selected':'')+'>'+CATS[k]+'</option>'});
  h+='</select></div></div>';
  h+='<div class="two"><div class="field"><label for="f-line">Range</label><select id="f-line"><option value="">—</option>';
  Object.keys(LINES).forEach(function(k){h+='<option value="'+k+'"'+(e.line===k?' selected':'')+'>'+LINES[k]+'</option>'});
  h+='</select></div><div class="field"><label for="f-when">Months sold</label><input id="f-when" placeholder="e.g. Oct 2026" value="'+esc(e.when)+'"></div></div>';
  h+='<div class="two"><div class="field"><label for="f-diet">Dietary labels</label><input id="f-diet" placeholder="e.g. Vegan · Gluten-free" value="'+esc(e.diet)+'"></div><div class="field"><span class="label">Availability</span><label class="toggle" style="min-height:44px"><input type="checkbox" id="f-live"'+(e.live!==false?' checked':'')+'> On sale now</label></div></div>';
  h+='<div class="field"><label for="f-check">Still to confirm</label><input id="f-check" placeholder="e.g. Popcorn label to confirm. Leave empty when checked" value="'+esc(e.check)+'"></div>';
  h+='<div class="field"><label for="f-desc">Ingredients</label><textarea id="f-desc">'+esc(e.desc)+'</textarea></div>';
  h+='<div class="field"><span class="label">Photo</span><div class="photo-row">'+(e.img?'<img class="mthumb lg" src="'+esc(e.img)+'" alt="">':'<span class="meta">No photo</span>')+(assets?'<label class="btn" for="f-photo">'+(ui.uploading?'Uploading…':e.img?'Change photo':'Add photo')+'</label><input type="file" id="f-photo" accept="image/*" hidden>':'')+(e.img?'<button type="button" class="linkish" data-act="rmPhoto">Remove</button>':'')+'</div></div>';
  h+='<div class="field"><label for="f-notes">Staff notes</label><textarea id="f-notes" placeholder="e.g. Milk can be swapped; check the alternative’s label">'+esc(e.notes)+'</textarea></div>';
  h+='<div class="field"><span class="label">Allergens</span><div class="aedit">';
  AL.forEach(function(a){var v=lv(e,a[0]);h+='<div class="aedit-row"><span>'+esc(a[1])+(a[2]?' <span class="meta">'+esc(a[2])+'</span>':'')+'</span><span class="tri" role="group" aria-label="'+esc(a[1])+'">'
    +[[0,'None'],[1,'May contain'],[2,'Contains']].map(function(o){return '<button type="button" data-tri="'+a[0]+'" data-v="'+o[0]+'" aria-pressed="'+(v===o[0])+'">'+o[1]+'</button>'}).join('')+'</span></div>'});
  h+='</div></div>';
  if(ui.confirmDel)h+='<div class="confirm"><span>Delete '+esc(e.name)+' for every shop?</span><span style="display:flex;gap:8px"><button type="button" class="btn danger" data-act="del">Delete</button><button type="button" class="btn" data-act="delCancel">Keep</button></span></div>';
  h+='<div class="actions">'+(!isNew&&!ui.confirmDel?'<button type="button" class="btn danger" data-act="delAsk" style="margin-right:auto">Delete</button>':'')+'<button class="btn primary"'+(ui.saving?' disabled':'')+'>'+(ui.saving?'Saving…':'Save')+'</button></div>';
  return h+'</form></div></div>'
}
function syncForm(){
  var e=ui.editing;if(!e)return;var g=function(id){var x=document.getElementById(id);return x?x.value:''};
  if(document.getElementById('f-name')){e.name=g('f-name');e.cat=g('f-cat');e.desc=g('f-desc');e.notes=g('f-notes');e.line=g('f-line');e.when=g('f-when');e.diet=g('f-diet');e.check=g('f-check').trim();var lv2=document.getElementById('f-live');e.live=lv2?lv2.checked:true}
}
var tt;function toast(m){ui.toast=m;render();clearTimeout(tt);tt=setTimeout(function(){ui.toast=null;render()},2600)}

function buildDoc(){
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+SRC.reset+'</style></head><body>'
   +HEAD+'<style id="appcss">'+SRC.css+'</style>\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script>'+SRC.js+'<\/script></body></html>'
}
function save(msg){
  if(!art){toast('You can’t save from this view. Open the page as an editor.');return Promise.reject()}
  S.updated=new Date().toISOString();ui.saving=true;render();
  return art.publish(buildDoc()).then(function(){ui.saving=false;toast(msg)},function(err){
    ui.saving=false;var c=err&&err.code;
    toast(c==='conflict'?'Someone else saved first. Reloading their version.':(c==='not_writer'||c==='not_granted')?'You have view-only access, so changes can’t be saved.':'Couldn’t save. Check the connection and try again.');
    throw err})
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,[data-act]');if(!t)return;
  var d=t.dataset;
  if(d.act==='close'&&ev.target!==t&&t.classList.contains('sheet-bg'))return;
  if(d.cat){ui.cat=d.cat;render();return}
  if(d.all){ui.all=d.all==="1";render();return}
  if(d.view){ui.view=d.view;try{localStorage.setItem('bearst-view',d.view)}catch(e){}render();return}
  if(d.avoid){var i=ui.avoid.indexOf(d.avoid);if(i>=0)ui.avoid.splice(i,1);else ui.avoid.push(d.avoid);render();return}
  if(d.open){ui.open=d.open;render();return}
  if(d.tri){syncForm();ui.editing.a[d.tri]=+d.v;if(!+d.v)delete ui.editing.a[d.tri];render();return}
  switch(d.act){
    case 'close':ui.open=null;render();break;
    case 'clearAvoid':ui.avoid=[];render();break;
    case 'editMode':ui.editMode=!ui.editMode;ui.seasonEdit=false;ui.confirmClear=false;render();break;
    case 'add':ui.open=null;ui.confirmDel=false;ui.editing={id:'i'+Date.now().toString(36),cat:ui.cat==='drink'?'drink':'cookie',line:ui.cat==='drink'?'':'seasonal',when:'',diet:'',live:true,name:'',desc:'',notes:'',a:{}};render();var n=document.getElementById('f-name');n&&n.focus();break;
    case 'edit':var it=S.items.filter(function(i){return i.id===d.id})[0];ui.confirmDel=false;ui.editing=JSON.parse(JSON.stringify(it));ui.editing.a=ui.editing.a||{};render();break;
    case 'cancelEdit':ui.editing=null;render();break;
    case 'rmPhoto':syncForm();delete ui.editing.img;delete ui.editing.band;render();break;
    case 'delAsk':syncForm();ui.confirmDel=true;render();break;
    case 'delCancel':syncForm();ui.confirmDel=false;render();break;
    case 'del':var id=ui.editing.id,name=ui.editing.name,prev=S.items;S.items=S.items.filter(function(i){return i.id!==id});ui.editing=null;ui.open=null;ui.confirmDel=false;
      save('Deleted '+name).catch(function(){S.items=prev;render()});break;
    case 'seasonEdit':ui.seasonEdit=true;render();break;
    case 'seasonCancel':ui.seasonEdit=false;render();break;
    case 'clearExAsk':ui.confirmClear=true;render();break;
    case 'clearExCancel':ui.confirmClear=false;render();break;
    case 'clearEx':var p2=S.items;S.items=S.items.filter(function(i){return !i.example});ui.confirmClear=false;save('Examples removed').catch(function(){S.items=p2;render()});break;
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='q'){ui.q=ev.target.value;render()}
  else if(ev.target.id==='strict'){ui.strict=ev.target.checked;render()}
});
document.addEventListener('change',function(ev){
  if(ev.target.id==='strict'){ui.strict=ev.target.checked;render();return}
  if(ev.target.id==='f-photo'&&ev.target.files&&ev.target.files[0]&&assets){
    var f=ev.target.files[0];syncForm();ui.uploading=true;render();
    shrink(f).then(function(b){return assets.upload(b)}).then(function(r){ui.uploading=false;if(ui.editing){ui.editing.img=r.url;delete ui.editing.band}render()},function(){ui.uploading=false;toast('Couldn’t upload that photo. Try a JPEG or PNG under 20 MB.')})
  }
});
function shrink(file){return new Promise(function(res){try{var u=URL.createObjectURL(file),im=new Image();im.onload=function(){var m=900,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||file)},'image/jpeg',.82)};im.onerror=function(){res(file)};im.src=u}catch(e){res(file)}})}
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  if(ev.target.id==='seasonForm'){var v=document.getElementById('seasonInput').value.trim();if(!v)return;var old=S.season;S.season=v;ui.seasonEdit=false;save('Season renamed').catch(function(){S.season=old;render()});return}
  if(ev.target.id==='editForm'){
    syncForm();var e=ui.editing;e.name=e.name.trim();if(!e.name){toast('Give the item a name.');return}
    e.updated=new Date().toISOString();delete e.example;
    var prev=S.items,ix=-1;S.items.forEach(function(i,k){if(i.id===e.id)ix=k});
    S.items=S.items.slice();if(ix>=0)S.items[ix]=e;else S.items.push(e);
    save('Saved '+e.name+' for all shops').then(function(){ui.editing=null;ui.open=e.id;render()},function(){S.items=prev;render()});
  }
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&(ui.open||ui.editing)&&!ui.saving){ui.open=null;ui.editing=null;render()}});

render();
if(window.claude&&window.claude.use){
  window.claude.use('assets').then(function(a){assets=a;if(a)render()},function(){});
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    art=r[0];var u=r[1];
    if(!art)return;
    if(!u){ui.canEdit=true;render();return}
    Promise.resolve(u.canEdit()).then(function(c){ui.canEdit=!!c;render()},function(){ui.canEdit=true;render()})
  },function(){})
}
})();
</script>
</body></html>
